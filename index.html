<style>

.r b{font-weight:400;text-align:left;direction:ltr;font-variant-numeric:tabular-nums}

.msg{padding:30px;text-align:center;color:var(--mu)}.bad{color:var(--no)}h3{margin:4px 2px 6px;font-size:13px}.pb{margin-top:10px}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}.kpi{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column}.kpi span{color:var(--mu);font-size:11px}.kpi b{font-size:16px;direction:ltr;text-align:right}.kpi small{color:var(--mu);font-size:10px}.kpi.ck{cursor:pointer}.kpi.ck:hover,.kpi.on{border-color:var(--pr)}.kpi.ng b{color:var(--no)}.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px}.cc{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;min-width:0}.cc.wd{grid-column:1/-1}.ch{height:250px;position:relative}.lk{color:var(--pr);cursor:pointer;font-size:11px;margin-inline-start:6px}#lg{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;align-items:center;justify-content:center}.mdb label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}td.dt{white-space:nowrap;direction:ltr;text-align:right}tr.tr0 td{background:var(--h1);font-weight:700}tr.tr1 td{background:var(--hd);font-weight:600}tr.tr2 td{font-weight:600}.chip{display:inline-block;background:var(--hd);border:1px solid var(--bd);border-radius:12px;padding:1px 8px;margin:2px;cursor:pointer;font-size:11px}.chip:hover{border-color:var(--pr)}#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center}.mdb{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;min-width:300px;max-width:92vw;max-height:90vh;overflow:auto}
@media print{@page{size:A4;margin:8mm}:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--cd:#fff;--tx:#000;--mu:#333;--bd:#999;--hd:#eee;--h1:#ddd;--no:#b00}header,nav,.bar{display:none!important}.scr,.scr.on{display:none}.scr.on{display:block}body{background:#fff;font-size:10px}main{padding:0}.box{border:0;overflow:visible}th{position:static}.pb{page-break-before:always}tr{page-break-inside:avoid}}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}table{table-layout:auto;width:100%!important;min-width:0!important}th,td{padding:1px 3px;font-size:9px;white-space:normal}td.n,th.n{white-space:nowrap}th{background:#e8eef9!important;color:#000}tr.eh td,tr.tr0 td,.r.hh{background:#dce6f7!important}tr.sub td,tr.tot td,tr.tr1 td{background:#eef3fb!important}.box{overflow:visible!important;border:1px solid #bbb}.cg{grid-template-columns:1fr 1fr}.cc{break-inside:avoid}.cc.wd{grid-column:1/-1}.ch{height:200px}.kp{grid-template-columns:repeat(4,1fr)}.pb{break-before:page;page-break-before:always;margin-top:0}}
</style></head><body>
<header><div><h1 dir="ltr">Accounting System</h1><div class="st" id="info">No file uploaded yet</div></div>
<div><input type="file" id="fi" accept=".xlsx,.xls,.xlsm" hidden><button class="btn" id="bup" onclick="fi.click()">Upload File</button> <button class="btn" onclick="pdf()">Export PDF</button> <button class="btn" id="bdel" onclick="delData()">Delete Data</button> <span class="st" id="who"></span> <button class="btn" onclick="auth().signOut()">Logout</button></div></header>
<nav id="nv"><button data-t="db" class="on">Dashboard</button><button data-t="tree">Chart of Accounts</button><button data-t="jr">Journal Entries</button><button data-t="tb">Trial Balance</button><button data-t="rp">Reports</button><button data-t="fs">Financial Statements</button><button data-t="us" id="nus" style="display:none">Users</button></nav>
<main>
<section class="scr" id="s-tree"><div class="bar"><button class="btn" onclick="TRA='all';render()">Expand All</button><button class="btn" onclick="TRA='none';render()">Collapse All</button><label>بحث في الحسابات<input id="tq" oninput="TRA='';render()" placeholder="رقم أو اسم الحساب"></label></div><div class="box" id="o-tree"></div></section>
<section class="scr" id="s-jr"><div class="bar"><label>من تاريخ<input type="date" id="jf" onchange="render()"></label><label>إلى تاريخ<input type="date" id="jt" onchange="render()"></label><label>بحث (رقم القيد / بيان / طرف / حساب)<input id="jq" oninput="render()"></label></div><div class="st" id="jc" style="margin:0 2px 8px"></div><div class="box" id="o-jr"></div></section>
<section class="scr" id="s-tb"><div class="bar"><label>من تاريخ<input type="date" id="tf" onchange="render()"></label><label>إلى تاريخ<input type="date" id="tt" onchange="render()"></label>
<label>مستوى العرض<select id="tl" onchange="render()"><option value="tree">هرمي (توسيع / تضييق)</option><option value="acc">الحسابات الفرعية</option><option value="grp">المجموعات</option><option value="nat">طبيعة الحساب</option><option value="main">الحسابات الرئيسية</option></select></label>
<button class="btn" onclick="TBA='all';render()">Expand All</button><button class="btn" onclick="TBA='none';render()">Collapse All</button>
<label><span><input type="checkbox" id="tz" checked onchange="render()" style="min-width:0"> إخفاء الأرصدة الصفرية</span></label></div><div class="box" id="o-tb"></div></section>
<section class="scr" id="s-rp"><div class="bar"><label style="flex:1;min-width:220px">بحث (اسم حساب / عميل / مورد / طرف / مركز تكلفة)<input id="rq" oninput="rq()" onkeydown="if(event.key==='Enter')rpick(0)" placeholder="اكتب جزئاً من الاسم أو الرقم" style="width:100%"></label><div id="rqr" style="flex-basis:100%"></div><label>التقرير<select id="rt" onchange="fillRS()"><option value="ledger">General Ledger (Main to Sub-account)</option><option value="cust">Customer Statements</option><option value="supp">Supplier Statements</option><option value="party">Statement by Party (Supplier / Customer / Partner)</option><option value="center">Cost / Profit Center Statement</option><option value="nca">Non-Current Assets Register</option></select></label>
<label id="l-rs">الحساب<select id="rs" onchange="render()"></select></label><label id="l-rp" style="display:none">اسم الطرف<input id="rp" list="pl" onchange="render()"><datalist id="pl"></datalist></label>
<label>من تاريخ<input type="date" id="rf" onchange="render()"></label><label>إلى تاريخ<input type="date" id="rto" onchange="render()"></label></div><div id="o-rp"></div></section>
<section class="scr" id="s-fs"><div class="bar"><label>اسم المنشأة<input id="fco" oninput="render()"></label><label>من تاريخ<input type="date" id="ff" onchange="render()"></label><label>إلى تاريخ (المركز المالي كما في)<input type="date" id="ft" onchange="render()"></label><label>مقارنة: من<input type="date" id="fcf" onchange="render()"></label><label>مقارنة: إلى<input type="date" id="fct" onchange="render()"></label><label>عرض قائمة الدخل<select id="fm" onchange="render()"><option value="all">موحد (إجمالي المنشأة)</option><option value="one">مركز تكلفة / ربحية واحد</option><option value="cols">أعمدة بجميع المراكز</option></select></label><label>المركز<select id="fx" onchange="render()"></select></label><button class="btn" onclick="fsAsk()">معدلات تحميل «عام»</button></div><div id="o-fs"></div></section>
<section class="scr on" id="s-db"><div class="bar"><label>من تاريخ<input type="date" id="df" onchange="render()"></label><label>إلى تاريخ<input type="date" id="dt" onchange="render()"></label><label>البند للتحليل التفصيلي<select id="dm" onchange="DB.g=null;render()"><option value="exp">Expenses</option><option value="cost">Cost of Revenue</option><option value="rev">Revenue</option><option value="cash">Cash &amp; Cash Equivalents</option></select></label><label>مركز التكلفة / الربحية<select id="dc" onchange="DB.g=null;render()"></select></label><label><span><input type="checkbox" id="dal" onchange="this.checked?fsAsk():render()" style="min-width:0"> تحميل «عام» على المراكز (بالنسب المحددة في القوائم المالية)</span></label><button class="btn" onclick="fsAsk()">معدلات تحميل «عام»</button><span class="st">اضغط على أي بطاقة أو شريحة في الرسوم الدائرية لتصفية التحليل</span></div><div id="o-db"></div></section>
<section class="scr" id="s-us"><div id="o-us"></div></section></main><div id="lg"></div><div id="md"><div class="mdb" id="mdb"></div></div>
<script>
const $=s=>document.querySelector(s),MAIN={1:'الأصول',2:'الالتزامات',3:'حقوق الملكية',4:'الإيرادات',5:'تكلفة الإيرادات',6:'المصروفات'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=n=>Math.abs(n)<0.005?'-':n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const bal=n=>Math.abs(n)<0.005?'-':f2(Math.abs(n))+(n>0?' م':' د');
const num=v=>{if(typeof v==='number')return v;const x=parseFloat(String(v==null?'':v).replace(/,/g,''));return isNaN(x)?0:x};
const an=v=>{const x=parseFloat(v);return isNaN(x)?'':String(Math.round(x))};
const iso=v=>{if(v==null||v==='')return'';if(typeof v==='number')return new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5).toISOString().slice(0,10);if(v instanceof Date)return v.toISOString().slice(0,10);const d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,10)};
let S={acc:{},by:{},lines:[],tree:{},nodes:[]},tab='db';
const flat=n=>n.no?[n]:Object.values(n.ch).flatMap(flat);
let CF=null,CW=null;function tot(A,from,to){let d=0,c=0;for(const a of A)for(const l of S.by[a.no]||[]){if(CF&&!CF(l))continue;if(from&&l.t<from)continue;if(to&&l.t>to)continue;const w=CW?CW(l):1;if(!w)continue;d+=l.dr*w;c+=l.cr*w}return{d,c}}
fi.onchange=e=>{const f=e.target.files[0];if(!f)return;if(S.lines.length&&!confirm('سيتم استبدال البيانات المحفوظة بالملف الجديد. هل تريد المتابعة؟')){fi.value='';return}const r=new FileReader();r.onload=()=>{try{load(r.result,f.name)}catch(x){alert('تعذر قراءة الملف: '+x.message)}};r.readAsArrayBuffer(f);fi.value=''};
function load(buf,name){
 const wb=XLSX.read(buf,{type:'array'});let A=null,J=null;
 for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
  for(let i=0;i<Math.min(r.length,15);i++){const h=r[i].map(x=>String(x==null?'':x).trim());
   if(!J&&h.includes('رقم القيد')&&h.includes('رقم الحساب')){J={r,i,h};break}
   if(!A&&h.includes('رئيسي')&&h.includes('رقم الحساب')&&!h.includes('رقم القيد')){A={r,i,h};break}}}
 if(!J)throw new Error('لم يتم العثور على شيت القيود اليومية (عمود رقم القيد)');
 const acc={};
 if(A){const c=k=>A.h.indexOf(k);for(const x of A.r.slice(A.i+1)){const no=an(x[c('رقم الحساب')]);if(!no)continue;acc[no]={no,main:no[0],nat:String(x[c('طبيعة الحساب')]||'غير مصنف').trim(),grp:String(x[c('فرعى2')]||'غير مصنف').trim(),name:String(x[c('اسم الحساب')]||no).trim()}}}
 const h=J.h,c=k=>h.findIndex(z=>z.startsWith(k)),ci={e:c('رقم القيد'),t:c('التاريخ'),d:c('البيان'),p:c('المورد'),a:c('رقم الحساب'),n:c('اسم الحساب'),dr:c('مدين'),cr:c('دائن'),c:c('مركز')};
 const lines=[];let k=0;
 for(const x of J.r.slice(J.i+1)){const a=an(x[ci.a]),t=iso(x[ci.t]);if(!a||!t)continue;
  if(!acc[a])acc[a]={no:a,main:a[0],nat:'غير مصنف',grp:'غير مصنف',name:String(x[ci.n]||a)};
  lines.push({e:num(x[ci.e]),t,d:x[ci.d]||'',p:String(x[ci.p]||'').trim(),a,n:acc[a].name,dr:num(x[ci.dr]),cr:num(x[ci.cr]),c:ci.c>=0?String(x[ci.c]==null?'':x[ci.c]).trim():'',i:k++})}
 lines.sort((p,q)=>p.t<q.t?-1:p.t>q.t?1:p.e-q.e||p.i-q.i);
 build(acc,lines,name);persist();}
function build(acc,lines,name){S.name=name;S.acc=acc;S.lines=lines;S.by={};for(const l of lines)(S.by[l.a]=S.by[l.a]||[]).push(l);
 const T={};for(const a of Object.keys(acc).sort().map(k=>acc[k])){const m=T[a.main]=T[a.main]||{k:a.main,l:MAIN[a.main]||'أخرى',ch:{}};const n=m.ch[a.nat]=m.ch[a.nat]||{l:a.nat,ch:{}};const g=n.ch[a.grp]=n.ch[a.grp]||{l:a.grp,ch:{}};g.ch[a.no]=a}
 S.tree=T;S.nodes=[];
 for(const m of Object.values(T)){S.nodes.push({l:m.k+' - '+m.l,lv:0,a:flat(m)});for(const n of Object.values(m.ch)){S.nodes.push({l:n.l,lv:1,a:flat(n)});for(const g of Object.values(n.ch)){S.nodes.push({l:g.l,lv:2,a:flat(g)});for(const a of Object.values(g.ch))S.nodes.push({l:a.no+' - '+a.name,lv:3,a:[a]})}}}
 const mn=lines[0].t,mx=lines[lines.length-1].t;
 for(const id of['jf','tf','rf','ff','df'])$('#'+id).value=mn;for(const id of['jt','tt','rto','ft','dt'])$('#'+id).value=mx;
 $('#pl').innerHTML=[...new Set(lines.map(l=>l.p).filter(Boolean))].sort().map(p=>`<option value="${esc(p)}">`).join('');
 $('#info').textContent=`${name} — ${new Set(lines.map(l=>l.e)).size} قيد، ${lines.length} سطر، ${Object.keys(acc).length} حساب (${mn} إلى ${mx})`;
 S.cc=[...new Set(lines.map(l=>l.c).filter(Boolean))].sort((a,b)=>a==='عام'?1:b==='عام'?-1:a.localeCompare(b));S.blank=lines.some(l=>!l.c&&'456'.includes(S.acc[l.a].main));FSA.done=false;$('#dc').innerHTML='<option value="*">جميع المراكز</option>'+S.cc.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')+(S.blank?'<option value="">غير موزع</option>':'');$('#fx').innerHTML=S.cc.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')+(S.blank?'<option value="">غير موزع</option>':'');
 fillRS();}
nv.onclick=e=>{const t=e.target.dataset.t;if(!t)return;tab=t;if(t==='fs')FSA.done=false;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b===e.target));document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==='s-'+t));render()};
const none='<div class="msg">Upload File — ارفع ملف الإكسيل أولاً</div>';
function render(){if(!S.lines.length&&tab!=='us'){$('#o-'+tab).innerHTML=none;return}({tree:rTree,jr:rJr,tb:rTb,rp:rRp,fs:rFs,db:rDb,us:rUs})[tab]()}
const cells=t=>`<b>${f2(t.d)}</b><b>${f2(t.c)}</b><b>${bal(t.d-t.c)}</b>`;
function tn(n,q,lv){
 if(n.no){if(q&&!(n.no+' '+n.name).includes(q))return'';return`<div class="r lf"><span>${n.no} - ${esc(n.name)}</span>${cells(tot([n]))}</div>`}
 const kids=Object.values(n.ch).map(x=>tn(x,q,lv+1)).join('');if(!kids)return'';
 return`<details ${TRA==='all'||(TRA!=='none'&&(q||lv<1))?'open':''}><summary class="r h${lv}"><span>${esc(n.k?n.k+' - '+n.l:n.l)}</span>${cells(tot(flat(n)))}</summary>${kids}</details>`}
function rTree(){const q=$('#tq').value.trim();$('#o-tree').innerHTML='<div class="r hh"><span>الحساب</span><b>مدين</b><b>دائن</b><b>الرصيد</b></div>'+Object.values(S.tree).map(m=>tn(m,q,0)).join('')}
function rJr(){
 const f=$('#jf').value,t=$('#jt').value,q=$('#jq').value.trim(),m={};
 for(const l of S.lines)(m[l.e]=m[l.e]||[]).push(l);
 const E=Object.values(m).filter(L=>{const d=L[0].t;if(f&&d<f||t&&d>t)return false;return!q||L.some(l=>(l.e+' '+l.d+' '+l.p+' '+l.n+' '+l.a).includes(q))}).sort((a,b)=>a[0].t<b[0].t?-1:a[0].t>b[0].t?1:a[0].e-b[0].e);
 let h='<table style="table-layout:fixed"><colgroup><col style="width:62px"><col><col style="width:22%"><col style="width:95px"><col style="width:95px"></colgroup><thead><tr><th>رقم الحساب</th><th>اسم الحساب</th><th>الطرف</th><th class="n">مدين</th><th class="n">دائن</th></tr></thead><tbody>',bad=0;

 $('#mdb').innerHTML=`<h3>Allocation of the General cost center to cost / profit centers</h3><p class="st">إجمالي مصروفات مركز «عام» عن الفترة المحددة: <b>${f2(G)}</b> جنيه. حدد نسبة تحميل كل مركز (المجموع 100%).</p>${rec.map((c,i)=>`<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><span style="flex:1">${esc(c)}</span><input type="number" step="0.01" min="0" max="100" id="fp${i}" value="${cur[i]}" oninput="fsSum()" style="min-width:80px;width:90px"> %</label>`).join('')}<div id="fsum" class="st"></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"><button class="btn" onclick="fsSet('eq')">بالتساوي</button><button class="btn" onclick="fsSet('rev')">بنسبة الإيرادات</button><button class="btn" onclick="fsSet('cost')">بنسبة التكلفة المباشرة</button></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px"><button class="btn" onclick="fsOk()">اعتماد وعرض القوائم</button><button class="btn" style="background:var(--mu)" onclick="fsOk(1)">عرض بدون تحميل</button><button class="btn" style="background:var(--mu)" onclick="$('#md').style.display='none'">إغلاق</button></div>`;
 $('#md').style.display='flex';fsSum()}
function fsSum(){const s=FSA.rec.reduce((a,c,i)=>a+(+$('#fp'+i).value||0),0);$('#fsum').innerHTML='المجموع: '+s.toFixed(2)+'%'+(Math.abs(s-100)>0.01?' <span class="bad">يجب أن يساوي 100%</span>':'')}
function fsSet(k){FSA.ask(k).forEach((x,i)=>$('#fp'+i).value=x);fsSum()}
function fsOk(skip){const rec=FSA.rec;if(skip)FSA.pct=null;else{const v=rec.map((c,i)=>+$('#fp'+i).value||0),s=v.reduce((a,b)=>a+b,0);if(Math.abs(s-100)>0.01){alert('مجموع النسب يجب أن يساوي 100% (الحالي '+s.toFixed(2)+'%)');return}FSA.pct={};rec.forEach((c,i)=>FSA.pct[c]=v[i])}FSA.done=true;$('#md').style.display='none';savePct();render()}
render();boot();
</script></body></html>
