<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Accounting System</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{--bg:#f4f6f9;--cd:#fff;--tx:#1b2430;--mu:#667085;--bd:#dde1e7;--pr:#1d4ed8;--hd:#e9eef7;--h1:#dbe6f7;--no:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--cd:#1a2029;--tx:#e6e9ee;--mu:#98a2b3;--bd:#2c3542;--pr:#6e9bff;--hd:#222b38;--h1:#2a3648;--no:#ff8a80}}
:root[data-theme="dark"]{--bg:#12161c;--cd:#1a2029;--tx:#e6e9ee;--mu:#98a2b3;--bd:#2c3542;--pr:#6e9bff;--hd:#222b38;--h1:#2a3648;--no:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:12px/1.35 Cairo,Tahoma,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--cd);border-bottom:1px solid var(--bd)}
h1{font-size:16px;margin:0}.st{color:var(--mu);font-size:12px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;font:inherit}
nav{display:flex;gap:4px;padding:8px 16px 0;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);padding:8px 14px;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--pr);border-color:var(--pr);font-weight:700}
main{padding:8px 10px}.scr{display:none}.scr.on{display:block}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;margin-bottom:8px}
.bar label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}
input,select{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:6px;padding:2px 6px;font:inherit;min-width:110px}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:10px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:1px 5px;border-bottom:1px solid var(--bd);text-align:right;word-break:break-word}
td.n,th.n{white-space:nowrap}.fh{text-align:center;padding:6px;font-weight:700;font-size:13px}.fn{padding:8px 4px}.fn h4{margin:6px 0}.fn h5{margin:10px 0 3px;font-size:12px}.fn p{margin:3px 0;color:var(--mu)}
th{background:var(--hd);position:sticky;top:0}
td.n,th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
tr.eh td{background:var(--h1);font-weight:700}tr.sub td,tr.tot td{background:var(--hd);font-weight:700}
.r{display:grid;grid-template-columns:1fr 100px 100px 110px;gap:4px;padding:2px 8px;border-bottom:1px solid var(--bd);align-items:center}
.r b{font-weight:400;text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
summary.r{cursor:pointer;font-weight:600}summary.h0{background:var(--h1)}summary.h1{background:var(--hd)}
details details>*{margin-inline-start:14px}.lf{color:var(--tx)}.hh{font-size:12px;color:var(--mu);background:var(--hd)}
.msg{padding:30px;text-align:center;color:var(--mu)}.bad{color:var(--no)}h3{margin:4px 2px 6px;font-size:13px}.pb{margin-top:10px}.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:8px}.kpi{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;display:flex;flex-direction:column}.kpi span{color:var(--mu);font-size:11px}.kpi b{font-size:16px;direction:ltr;text-align:right}.kpi small{color:var(--mu);font-size:10px}.kpi.ck{cursor:pointer}.kpi.ck:hover,.kpi.on{border-color:var(--pr)}.kpi.ng b{color:var(--no)}.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px}.cc{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;min-width:0}.cc.wd{grid-column:1/-1}.ch{height:250px;position:relative}.lk{color:var(--pr);cursor:pointer;font-size:11px;margin-inline-start:6px}#lg{display:none;position:fixed;inset:0;background:var(--bg);z-index:100;align-items:center;justify-content:center}.mdb label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:2px}td.dt{white-space:nowrap;direction:ltr;text-align:right}tr.tr0 td{background:var(--h1);font-weight:700}tr.tr1 td{background:var(--hd);font-weight:600}tr.tr2 td{font-weight:600}.chip{display:inline-block;background:var(--hd);border:1px solid var(--bd);border-radius:12px;padding:1px 8px;margin:2px;cursor:pointer;font-size:11px}.chip:hover{border-color:var(--pr)}#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center}.mdb{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px;min-width:300px;max-width:92vw;max-height:90vh;overflow:auto}
@media print{@page{size:A4;margin:8mm}:root:not([data-theme="light"]),:root[data-theme="dark"]{--bg:#fff;--cd:#fff;--tx:#000;--mu:#333;--bd:#999;--hd:#eee;--h1:#ddd;--no:#b00}header,nav,.bar{display:none!important}.scr,.scr.on{display:none}.scr.on{display:block}body{background:#fff;font-size:10px}main{padding:0}.box{border:0;overflow:visible}th{position:static}.pb{page-break-before:always}tr{page-break-inside:avoid}}
@media print{*{-webkit-print-color-adjust:exact;print-color-adjust:exact}table{table-layout:auto;width:100%!important;min-width:0!important}th,td{padding:1px 3px;font-size:9px;white-space:normal}td.n,th.n{white-space:nowrap}th{background:#e8eef9!important;color:#000}tr.eh td,tr.tr0 td,.r.hh{background:#dce6f7!important}tr.sub td,tr.tot td,tr.tr1 td{background:#eef3fb!important}.box{overflow:visible!important;border:1px solid #bbb}.cg{grid-template-columns:1fr 1fr}.cc{break-inside:avoid}.cc.wd{grid-column:1/-1}.ch{height:200px}.kp{grid-template-columns:repeat(4,1fr)}.pb{break-before:page;page-break-before:always;margin-top:0}}

<script>
const $=s=>document.querySelector(s),MAIN={1:'الأصول',2:'الالتزامات',3:'حقوق الملكية',4:'الإيرادات',5:'تكلفة الإيرادات',6:'المصروفات'};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f2=n=>Math.abs(n)<0.005?'-':n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const bal=n=>Math.abs(n)<0.005?'-':f2(Math.abs(n))+(n>0?' م':' د');
const num=v=>{if(typeof v==='number')return v;const x=parseFloat(String(v==null?'':v).replace(/,/g,''));return isNaN(x)?0:x};
const an=v=>{const x=parseFloat(v);return isNaN(x)?'':String(Math.round(x))};
const iso=v=>{if(v==null||v==='')return'';if(typeof v==='number')return new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5).toISOString().slice(0,10);if(v instanceof Date)return v.toISOString().slice(0,10);const d=new Date(v);return isNaN(d)?'':d.toISOString().slice(0,10)};
let S={acc:{},by:{},lines:[],tree:{},nodes:[]},tab='db';
const flat=n=>n.no?[n]:Object.values(n.ch).flatMap(flat);
let CF=null,CW=null;function tot(A,from,to){let d=0,c=0;for(const a of A)for(const l of S.by[a.no]||[]){if(CF&&!CF(l))continue;if(from&&l.t<from)continue;if(to&&l.t>to)continue;const w=CW?CW(l):1;if(!w)continue;d+=l.dr*w;c+=l.cr*w}return{d,c}}
fi.onchange=e=>{const f=e.target.files[0];if(!f)return;if(S.lines.length&&!confirm('سيتم استبدال البيانات المحفوظة بالملف الجديد. هل تريد المتابعة؟')){fi.value='';return}const r=new FileReader();r.onload=()=>{try{load(r.result,f.name)}catch(x){alert('تعذر قراءة الملف: '+x.message)}};r.readAsArrayBuffer(f);fi.value=''};
function load(buf,name){
 const wb=XLSX.read(buf,{type:'array'});let A=null,J=null;
 for(const n of wb.SheetNames){const r=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null});
  for(let i=0;i<Math.min(r.length,15);i++){const h=r[i].map(x=>String(x==null?'':x).trim());
   if(!J&&h.includes('رقم القيد')&&h.includes('رقم الحساب')){J={r,i,h};break}
   if(!A&&h.includes('رئيسي')&&h.includes('رقم الحساب')&&!h.includes('رقم القيد')){A={r,i,h};break}}}

function depCalc(a,rate,f,to){
 const DY=86400000,day=s=>Date.parse(s)/DY,L=(S.by[a.no]||[]).filter(l=>!to||l.t<=to),end=day(to||S.lines[S.lines.length-1].t),sf=f?day(f):null;

 const adv=d=>{if(last!==null&&bal>0&&d>last)acc+=bal*rate/100*(d-last)/365;if(last===null||d>last)last=d};
 for(const l of L){const d=day(l.t);if(!seen&&d>=sf){adv(sf);a0=acc;c0=bal;seen=true}adv(d);const n=l.dr-l.cr;
  if(n>0){bal+=n;if(!first)first=l.t;if(!f||d>=sf)add+=n}

function frCalc(f,t){

 g=(m,fn)=>A.filter(a=>a.main===m&&(!fn||fn(a))),cashA=A.filter(a=>CASHRX.test(a.grp)),
 ca=g('1',a=>!a.nat.includes('غير متداولة')),nca=g('1',a=>a.nat.includes('غير متداولة')),cl=g('2',a=>!a.nat.includes('طويلة')),ll=g('2',a=>a.nat.includes('طويلة')),
 R=per(g('4')),C=-per(g('5')),E=-per(g('6')),ga=-per(g('6',a=>!a.grp.includes('خسائر'))),GP=R-C,OP=GP-ga,NP=GP-E,
 CA=bal(ca,1),TA=CA+bal(nca,1),CL=bal(cl,-1),TL=CL+bal(ll,-1),EQ=bal(g('3'),-1)+bal(A.filter(a=>a.main>='4'),-1),
